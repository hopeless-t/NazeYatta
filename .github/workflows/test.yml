name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q


  package-smoke:
    name: Built wheel fresh-install smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Fresh-install built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/nazeyatta-*.whl
          EXPECTED_VERSION="$(python -c 'import nazeyatta; print("nazeyatta " + nazeyatta.__version__)')"
          test "$(nazeyatta --version)" = "$EXPECTED_VERSION"
      - name: Exercise installed CLI surface
        shell: bash
        run: |
          set -euo pipefail
          . .wheel-smoke/bin/activate
          nazeyatta example safe-read | nazeyatta check -
          nazeyatta schema task >/dev/null
          nazeyatta schema verification-request >/dev/null
          nazeyatta schema post-action-observation >/dev/null
          nazeyatta schema verification-receipt >/dev/null
          nazeyatta debrief-template NY-AUTH-001 >/dev/null

          python - <<'PY'
          from pathlib import Path
          import yaml
          from nazeyatta.evaluator import stable_hash

          def fp(label):
              return stable_hash({"label": label})

          request = {
              "schema_version": "0.1",
              "classification": "POST_ACTION_VERIFICATION_REQUEST",
              "verification_id": "WHEEL-SMOKE",
              "task_id": "WHEEL-SMOKE-TASK",
              "preflight_receipt_fingerprint": fp("preflight"),
              "task_fingerprint": fp("task"),
              "action_fingerprint": fp("action"),
              "target_binding": {
                  "kind": "smoke-target",
                  "identifier": "wheel",
                  "identity_fingerprint": fp("target"),
              },
              "expected_facts": {"installed_cli_works": True},
              "authority_granted": False,
          }
          observation = {
              "schema_version": "0.1",
              "classification": "POST_ACTION_OBSERVATION",
              "observation_id": "WHEEL-SMOKE-OBS",
              "verification_id": request["verification_id"],
              "task_id": request["task_id"],
              "preflight_receipt_fingerprint": request["preflight_receipt_fingerprint"],
              "task_fingerprint": request["task_fingerprint"],
              "action_fingerprint": request["action_fingerprint"],
              "target_binding": request["target_binding"],
              "observed_facts": {
                  "installed_cli_works": {
                      "observation_state": "OBSERVED",
                      "value": True,
                  }
              },
              "observed_by": {"type": "workflow", "identifier": "wheel-smoke"},
              "observed_at": "2026-09-25T00:00:00+09:00",
              "authority_granted": False,
          }
          Path("/tmp/verify-request.yaml").write_text(
              yaml.safe_dump(request, sort_keys=False), encoding="utf-8"
          )
          Path("/tmp/verify-observation.yaml").write_text(
              yaml.safe_dump(observation, sort_keys=False), encoding="utf-8"
          )
          PY

          nazeyatta verify /tmp/verify-request.yaml /tmp/verify-observation.yaml | grep VERIFIED_SUCCESS


  dogfood-safe-read:
    name: Runtime dogfood safe-read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Fresh-process safe-read dogfood
        run: python tools/dogfood_safe_read.py


  dogfood-baseline-derivation:
    name: Baseline derivation dogfood
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Bounded baseline derivation dogfood
        run: python tools/dogfood_baseline_derivation.py
