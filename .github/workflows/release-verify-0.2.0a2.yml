name: Release Verify 0.2.0a2

on:
  push:
    branches:
      - release/0.2.0a2-verify

permissions:
  contents: read

env:
  CANDIDATE: 0a2876f5204b19cc67533d5bf37ac4b72de940a7

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact candidate plus verification-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          CHANGED="$(git diff --name-only "$CANDIDATE"...HEAD)"
          test "$CHANGED" = ".github/workflows/release-verify-0.2.0a2.yml" || {
            echo "unexpected candidate delta:"
            printf '%s\n' "$CHANGED"
            exit 1
          }

      - name: Install build frontend and source-test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e . pytest

      - name: Run source suite
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Record hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          {
            echo "candidate=$CANDIDATE"
            echo "verification_commit=$(git rev-parse HEAD)"
            echo "version=0.2.0a2"
            echo
            echo "[dist]"
            ls -l dist/
            echo
            echo "[sha256]"
            sha256sum dist/*
          } | tee release-evidence/build-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nazeyatta-0.2.0a2-verify-dist
          path: |
            dist/*
            release-evidence/build-receipt.txt
          if-no-files-found: error
          retention-days: 7

  verify-wheel:
    name: Fresh installed wheel / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: nazeyatta-0.2.0a2-verify-dist
          path: candidate-artifact

      - name: Fresh install built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .verify-venv
          . .verify-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install candidate-artifact/dist/*.whl

      - name: Verify package and receipt version away from source tree
        shell: bash
        run: |
          set -euo pipefail
          . .verify-venv/bin/activate
          mkdir -p /tmp/nazeyatta-020a2-verify
          cd /tmp/nazeyatta-020a2-verify
          python - <<'PY'
          from importlib.metadata import version
          import nazeyatta
          from nazeyatta.evaluator import evaluate
          from nazeyatta.cli import default_policy_path
          from nazeyatta.evaluator import load_yaml

          assert version("nazeyatta") == "0.2.0a2"
          assert nazeyatta.__version__ == "0.2.0a2"

          task = {
              "task_id": "VERIFY-VERSION",
              "action": {"operation": "read", "side_effect": "none", "externality": "internal"},
              "semantics": {"critical_meaning_complete": True},
              "evidence": {},
          }
          receipt = evaluate(task, load_yaml(default_policy_path()))
          assert receipt.evaluator_version == "0.2.0a2"
          assert receipt.authority_granted is False
          print("package_version=0.2.0a2")
          print("runtime_version=0.2.0a2")
          print("receipt_version=0.2.0a2")
          PY

      - name: Verify packaged publish-photo extraction and BLOCK semantics
        shell: bash
        run: |
          set -euo pipefail
          . .verify-venv/bin/activate
          cd /tmp/nazeyatta-020a2-verify

          nazeyatta example publish-photo > publish-photo.yaml
          test -s publish-photo.yaml
          grep -q '^task_id: EX-PUBLISH-PHOTO$' publish-photo.yaml
          test "$(nazeyatta example publish-photo | sha256sum | awk '{print $1}')" = "$(sha256sum publish-photo.yaml | awk '{print $1}')"

          set +e
          nazeyatta check publish-photo.yaml > publish-photo-result.txt 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -eq 2
          grep -q "BLOCK" publish-photo-result.txt
          grep -q "EXECUTION AUTHORITY: NOT GRANTED BY NAZEYATTA" publish-photo-result.txt
          echo "publish_photo_check_exit=$EXIT"

      - name: Verify packaged safe-read extraction and PASS semantics
        shell: bash
        run: |
          set -euo pipefail
          . .verify-venv/bin/activate
          cd /tmp/nazeyatta-020a2-verify

          nazeyatta example safe-read > safe-read.yaml
          test -s safe-read.yaml
          grep -q '^task_id: EX-SAFE-READ$' safe-read.yaml

          nazeyatta check safe-read.yaml > safe-read-result.txt 2>&1
          EXIT=$?
          test "$EXIT" -eq 0
          grep -q "PASS" safe-read-result.txt
          grep -q "EXECUTION AUTHORITY: NOT GRANTED BY NAZEYATTA" safe-read-result.txt
          echo "safe_read_check_exit=$EXIT"

      - name: Capture evidence
        shell: bash
        run: |
          set -euo pipefail
          . .verify-venv/bin/activate
          mkdir -p "$GITHUB_WORKSPACE/release-evidence/python-${{ matrix.python-version }}"
          cd /tmp/nazeyatta-020a2-verify
          cp publish-photo.yaml publish-photo-result.txt safe-read.yaml safe-read-result.txt             "$GITHUB_WORKSPACE/release-evidence/python-${{ matrix.python-version }}/"
          {
            echo "candidate=$CANDIDATE"
            echo "python=$(python --version 2>&1)"
            echo "package_version=$(python -c 'from importlib.metadata import version; print(version("nazeyatta"))')"
            echo "packaged_publish_photo=true"
            echo "packaged_safe_read=true"
            echo "publish_photo_exit=2"
            echo "safe_read_exit=0"
          } > "$GITHUB_WORKSPACE/release-evidence/python-${{ matrix.python-version }}/summary.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: nazeyatta-0.2.0a2-python-${{ matrix.python-version }}-evidence
          path: release-evidence/python-${{ matrix.python-version }}/
          if-no-files-found: error
          retention-days: 7
