name: Publish NazeYatta 0.2.0a1 to PyPI

on:
  push:
    branches:
      - release/0.2.0a1-pypi

permissions:
  contents: read
  id-token: write

env:
  TAG: v0.2.0a1
  VERSION: 0.2.0a1
  FINAL_COMMIT: fa11c1c3eaf581cc025669ae5c60b0a2f114a5e2
  WHEEL_SHA256: b8654856df1a681ae2d617b04274189106e83bcbfc7c00190a66ed8d1badd216
  SDIST_SHA256: f431da3bd0ddc0b4986c9f889a36a660bb9ab65a7e3dc83c8cc8ba42538102f8

jobs:
  publish-pypi:
    name: Publish exact verified assets to PyPI
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert workflow-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FINAL_COMMIT" HEAD
          CHANGED="$(git diff --name-only "$FINAL_COMMIT"...HEAD)"
          test "$CHANGED" = ".github/workflows/publish-pypi-0.2.0a1.yml" || {
            echo "unexpected PyPI publication-branch delta:"
            printf '%s\n' "$CHANGED"
            exit 1
          }

      - name: Verify GitHub release tag still targets exact final commit
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$FINAL_COMMIT"
          RELEASE_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')"
          test "$RELEASE_TARGET" = "$FINAL_COMMIT"
          PRERELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.prerelease')"
          test "$PRERELEASE" = "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact GitHub Release distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pypi-dist evidence
          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --dir pypi-dist             --pattern 'nazeyatta-0.2.0a1-py3-none-any.whl'             --pattern 'nazeyatta-0.2.0a1.tar.gz'

          test "$(sha256sum pypi-dist/nazeyatta-0.2.0a1-py3-none-any.whl | awk '{print $1}')" = "$WHEEL_SHA256"
          test "$(sha256sum pypi-dist/nazeyatta-0.2.0a1.tar.gz | awk '{print $1}')" = "$SDIST_SHA256"

          {
            echo "$WHEEL_SHA256  nazeyatta-0.2.0a1-py3-none-any.whl"
            echo "$SDIST_SHA256  nazeyatta-0.2.0a1.tar.gz"
          } > evidence/EXPECTED_SHA256SUMS.txt

      - name: Validate distribution metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip twine
          python -m twine check pypi-dist/*

      - name: Inspect current PyPI state
        id: pypi_state
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o evidence/pypi-before.json -w '%{http_code}'             https://pypi.org/pypi/nazeyatta/json)"

          if [ "$HTTP" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "project_state=not_found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$HTTP" = "200"

          COUNT="$(jq --arg v "$VERSION" '.releases[$v] // [] | length' evidence/pypi-before.json)"
          if [ "$COUNT" -eq 0 ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "project_state=exists_without_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WHEEL="$(jq -r --arg v "$VERSION" '
            .releases[$v][] |
            select(.filename == "nazeyatta-0.2.0a1-py3-none-any.whl") |
            .digests.sha256
          ' evidence/pypi-before.json)"
          SDIST="$(jq -r --arg v "$VERSION" '
            .releases[$v][] |
            select(.filename == "nazeyatta-0.2.0a1.tar.gz") |
            .digests.sha256
          ' evidence/pypi-before.json)"

          test "$WHEEL" = "$WHEEL_SHA256"
          test "$SDIST" = "$SDIST_SHA256"
          echo "already_published=true" >> "$GITHUB_OUTPUT"
          echo "project_state=exact_version_already_present" >> "$GITHUB_OUTPUT"

      - name: Detect pre-provisioned token fallback without exposing it
        id: token_state
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "token_name=PYPI_API_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${PYPI_TOKEN:-}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "token_name=PYPI_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
            echo "token_name=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish through PyPI Trusted Publishing
        id: trusted_publish
        if: steps.pypi_state.outputs.already_published != 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true
          print-hash: true

      - name: Publish with pre-provisioned API token fallback
        if: >-
          steps.pypi_state.outputs.already_published != 'true' &&
          steps.trusted_publish.outcome == 'failure' &&
          steps.token_state.outputs.token_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.token_state.outputs.token_name }}" = "PYPI_API_TOKEN" ]; then
            TOKEN="$PYPI_API_TOKEN"
          else
            TOKEN="$PYPI_TOKEN"
          fi
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          python -m twine upload             --non-interactive             --skip-existing             --username __token__             --password "$TOKEN"             pypi-dist/*

      - name: Fail closed when no PyPI authentication path exists
        if: >-
          steps.pypi_state.outputs.already_published != 'true' &&
          steps.trusted_publish.outcome == 'failure' &&
          steps.token_state.outputs.token_available != 'true'
        shell: bash
        run: |
          echo "::error::PyPI upload was not authenticated. Configure a pending/normal Trusted Publisher for this workflow or provide an existing repository PyPI token secret."
          exit 1

      - name: Wait for exact PyPI release metadata and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          URL="https://pypi.org/pypi/nazeyatta/$VERSION/json"
          FOUND=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$URL" -o evidence/pypi-after.json; then
              WHEEL="$(jq -r '
                .urls[] |
                select(.filename == "nazeyatta-0.2.0a1-py3-none-any.whl") |
                .digests.sha256
              ' evidence/pypi-after.json)"
              SDIST="$(jq -r '
                .urls[] |
                select(.filename == "nazeyatta-0.2.0a1.tar.gz") |
                .digests.sha256
              ' evidence/pypi-after.json)"
              if [ "$WHEEL" = "$WHEEL_SHA256" ] && [ "$SDIST" = "$SDIST_SHA256" ]; then
                FOUND=1
                break
              fi
            fi
            sleep 10
          done
          test "$FOUND" -eq 1

          jq '{
            info: {
              name: .info.name,
              version: .info.version,
              requires_python: .info.requires_python,
              project_url: .info.project_url
            },
            files: [.urls[] | {
              filename,
              packagetype,
              size,
              sha256: .digests.sha256,
              upload_time_iso_8601
            }]
          }' evidence/pypi-after.json > evidence/pypi-summary.json

      - name: Re-download PyPI-hosted files and verify exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pypi-redownload
          WHEEL_URL="$(jq -r '.urls[] | select(.filename == "nazeyatta-0.2.0a1-py3-none-any.whl") | .url' evidence/pypi-after.json)"
          SDIST_URL="$(jq -r '.urls[] | select(.filename == "nazeyatta-0.2.0a1.tar.gz") | .url' evidence/pypi-after.json)"
          test -n "$WHEEL_URL"
          test -n "$SDIST_URL"

          curl -fL "$WHEEL_URL" -o pypi-redownload/nazeyatta-0.2.0a1-py3-none-any.whl
          curl -fL "$SDIST_URL" -o pypi-redownload/nazeyatta-0.2.0a1.tar.gz

          (
            cd pypi-redownload
            sha256sum -c ../evidence/EXPECTED_SHA256SUMS.txt
          ) | tee evidence/pypi-redownload-sha256.txt

      - name: Fresh install from PyPI public index
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .pypi-verify-venv
          . .pypi-verify-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install             --no-cache-dir             --index-url https://pypi.org/simple/             "nazeyatta==$VERSION"

          cd /tmp
          python - <<'PY' | tee "$GITHUB_WORKSPACE/evidence/pypi-install.txt"
          from importlib.metadata import version
          import nazeyatta

          assert version("nazeyatta") == "0.2.0a1"
          assert nazeyatta.__version__ == "0.2.0a1"
          print("pypi_package_version=0.2.0a1")
          print("pypi_runtime_version=0.2.0a1")
          PY

      - name: Record authentication route without secrets
        if: always()
        shell: bash
        run: |
          {
            echo "github_release_tag=$TAG"
            echo "final_commit=$FINAL_COMMIT"
            echo "pypi_state_before=${{ steps.pypi_state.outputs.project_state }}"
            echo "trusted_publish_outcome=${{ steps.trusted_publish.outcome }}"
            echo "token_fallback_available=${{ steps.token_state.outputs.token_available }}"
          } > evidence/publication-route.txt

      - name: Upload PyPI publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nazeyatta-0.2.0a1-pypi-publication-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
