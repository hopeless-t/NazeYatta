[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nazeyatta"
version = "0.2.0a3"
description = "Preflight hazard analysis for AI and software workers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Catfood Lab"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/hopeless-t/NazeYatta"
Repository = "https://github.com/hopeless-t/NazeYatta"
Issues = "https://github.com/hopeless-t/NazeYatta/issues"
Changelog = "https://github.com/hopeless-t/NazeYatta/blob/main/CHANGELOG.md"

[project.scripts]
nazeyatta = "nazeyatta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
nazeyatta = ["data/*.yaml"]
